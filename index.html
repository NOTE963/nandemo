<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>なんでもコレクション</title>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#1a1330; --bg2:#2a1f4d; --card:#241a3f; --accent:#ff5fa2; --accent2:#5fd1ff;
  --gold:#ffd54a; --text:#fff; --muted:#b6acd6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  margin:0; height:100%; min-height:100vh; background:
    radial-gradient(circle at 20% 0%, #3a2570, transparent 60%),
    radial-gradient(circle at 90% 10%, #1e2a5e, transparent 55%),
    var(--bg);
  color:var(--text); font-family:'Hiragino Sans','Yu Gothic',sans-serif;
  overflow-x:hidden;
}
header{
  position:sticky; top:0; z-index:20;
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;
  background:rgba(20,14,40,.85); backdrop-filter:blur(6px);
  display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid #ffffff22;
}
header h1{font-size:16px; margin:0; background:linear-gradient(90deg,var(--accent),var(--accent2),var(--gold));
  -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:800;}
#gemBox{display:flex; align-items:center; gap:5px; background:#00000055; padding:6px 12px; border-radius:20px; border:1px solid var(--gold);}
#gemBox b{color:var(--gold); font-size:15px;}
main{padding:12px 12px 90px; max-width:520px; margin:0 auto;}
nav{position:fixed; bottom:0; left:0; right:0; z-index:20; display:flex;
  background:rgba(20,14,40,.95); border-top:1px solid #ffffff22;
  padding-bottom:env(safe-area-inset-bottom,0px);}
nav button{flex:1; background:none; border:none; color:var(--muted); padding:10px 2px; font-size:11px; cursor:pointer;}
nav button.active{color:var(--accent2); font-weight:700;}
nav button div{font-size:19px;}
.screen{display:none;}
.screen.active{display:block; animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
.card-box{background:var(--card); border-radius:16px; padding:16px; margin-bottom:14px; border:1px solid #ffffff14;}
h2{margin:0 0 10px; font-size:17px;}
button.btn{background:linear-gradient(90deg,var(--accent),#c93aff); color:#fff; border:none; padding:13px 18px;
  border-radius:14px; font-size:15px; font-weight:700; cursor:pointer; width:100%;}
button.btn:disabled{opacity:.4;}
button.btn.secondary{background:linear-gradient(90deg,#3d3266,#2a2450); }
input[type=text]{width:100%; padding:12px; border-radius:10px; border:1px solid #ffffff33; background:#00000044; color:#fff; font-size:15px;}
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.dex-item{background:#00000044; border-radius:12px; padding:6px; text-align:center; border:2px solid transparent; position:relative;}
.dex-item img{width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; display:block; background:#000;}
.dex-item.locked img{filter:brightness(0); opacity:.5;}
.dex-item .nm{font-size:10px; margin-top:3px; color:var(--muted); line-height:1.2;}
.dex-item .cnt{font-size:10px; color:var(--gold);}
.v-normal{border-color:#666;}
.v-color{border-color:var(--v-color,#f55);}
.v-rainbow{border-image:linear-gradient(90deg,red,orange,yellow,green,blue,violet) 1; animation:pulse 1.4s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 4px #fff3;} 50%{box-shadow:0 0 14px #fff9;}}
#ufoStage{position:relative; height:220px; background:linear-gradient(#0d0a24,#241a44); border-radius:14px; overflow:hidden; margin-bottom:12px;}
#claw{position:absolute; top:0; left:50%; transform:translateX(-50%); width:6px; height:40px; background:#ddd; transition:height .5s ease;}
#clawHead{position:absolute; top:40px; left:50%; transform:translateX(-50%); font-size:26px; transition:top .6s ease;}
.prizeImg{position:absolute; bottom:14px; left:50%; transform:translateX(-50%); width:46px; height:46px; border-radius:8px; object-fit:cover;}
#gachaStage{height:230px; display:flex; align-items:center; justify-content:center; position:relative; background:radial-gradient(circle,#3a2570,#140e28); border-radius:14px; margin-bottom:12px; overflow:hidden;}
#gachaResult{width:120px; height:120px; border-radius:16px; object-fit:cover; opacity:0; transform:scale(.3) rotate(-15deg);}
.flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none;}
@keyframes flashAnim{0%{opacity:0;}15%{opacity:1;}100%{opacity:0;}}
@keyframes popIn{0%{opacity:0; transform:scale(.2) rotate(-30deg);}60%{opacity:1; transform:scale(1.15) rotate(6deg);}100%{opacity:1; transform:scale(1) rotate(0);}}
.rays{position:absolute; inset:-40%; background:conic-gradient(from 0deg, transparent 0 10deg, #ffffff22 10deg 12deg); opacity:0;}
@keyframes spin{from{transform:rotate(0);} to{transform:rotate(360deg);}}
.rarityTag{position:absolute; top:8px; left:50%; transform:translateX(-50%); font-size:11px; font-weight:800; padding:3px 10px; border-radius:10px; opacity:0;}
.trade-item{background:#00000044; border-radius:12px; padding:10px; margin-bottom:8px; display:flex; gap:10px; align-items:center;}
.trade-item img{width:44px; height:44px; border-radius:8px; object-fit:cover;}
.trade-item .info{flex:1; font-size:12px; color:var(--muted);}
small.hint{color:var(--muted); font-size:11px; display:block; margin-top:4px;}
select{width:100%; padding:10px; border-radius:10px; background:#00000044; color:#fff; border:1px solid #ffffff33; margin-bottom:8px;}
.toast{position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:#000000cc; padding:10px 18px; border-radius:20px; font-size:13px; z-index:40; opacity:0; transition:opacity .3s;}
.toast.show{opacity:1;}
#loginWrap{display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;}
</style>
</head>
<body>

<div id="loginWrap" style="display:none;">
  <div class="card-box" style="max-width:340px; width:100%; text-align:center;">
    <h2>ユーザーネームを決めよう</h2>
    <input type="text" id="unameInput" maxlength="12" placeholder="なまえ (12文字まで)">
    <br><br>
    <button class="btn" id="startBtn">はじめる</button>
  </div>
</div>

<div id="app" style="display:none;">
<header>
  <h1>なんでもコレクション</h1>
  <div id="gemBox">💎 <b id="gemCount">0</b></div>
</header>

<main>
  <section id="s-home" class="screen active">
    <div class="card-box">
      <h2 id="welcomeMsg">ようこそ！</h2>
      <p style="color:var(--muted); font-size:13px; line-height:1.6;">
        UFOキャッチャーでジェムを集めて、ガチャでキャラをコレクションしよう。<br>
        集めたキャラはトレードで交換できるよ。
      </p>
    </div>
    <div class="card-box">
      <h2>📊 コレクション状況</h2>
      <p style="font-size:13px; color:var(--muted);">所持カード数: <b id="ownedTotal" style="color:#fff;">0</b> / <span id="allTotal">0</span></p>
    </div>
  </section>

  <section id="s-ufo" class="screen">
    <div class="card-box">
      <h2>🕹️ ナゾのUFOキャッチャー</h2>
      <div id="ufoStage">
        <div id="claw">|</div>
        <div id="clawHead">🦾</div>
        <img id="ufoPrizeImg" class="prizeImg" style="display:none;">
      </div>
      <button class="btn" id="grabBtn">つかむ！（何回でもOK）</button>
      <small class="hint">成功率アップ中… ジェムがもらえるかも💎</small>
    </div>
  </section>

  <section id="s-gacha" class="screen">
    <div class="card-box">
      <h2>🎰 コレクションガチャ</h2>
      <div id="gachaStage">
        <div class="rays" id="gachaRays"></div>
        <div class="flash" id="gachaFlash"></div>
        <div class="rarityTag" id="rarityTag">NORMAL</div>
        <img id="gachaResult">
      </div>
      <button class="btn" id="gachaBtn">ガチャを回す（💎10）</button>
      <p style="font-size:11px; color:var(--muted); margin-top:8px; line-height:1.6;">
        ノーマル：よく出る　｜　カラー(赤・青・緑など)：レア　｜　<span style="background:linear-gradient(90deg,red,orange,yellow,green,blue,violet); -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:800;">レインボー</span>：激レア
      </p>
    </div>
  </section>

  <section id="s-dex" class="screen">
    <div class="card-box">
      <h2>📖 図鑑</h2>
      <p style="font-size:11px; color:var(--muted);">所持数 / 全体の存在数（みんなが集めた合計）</p>
      <div class="grid" id="dexGrid"></div>
    </div>
  </section>

  <section id="s-trade" class="screen">
    <div class="card-box">
      <h2>🔁 トレード出品</h2>
      <select id="tradeOfferSelect"></select>
      <select id="tradeWantSelect"></select>
      <button class="btn" id="tradePostBtn">この内容で出品する</button>
    </div>
    <div class="card-box">
      <h2>📋 出品中のトレード</h2>
      <div id="tradeList"></div>
    </div>
  </section>

  <section id="s-me" class="screen">
    <div class="card-box">
      <h2>👤 マイページ</h2>
      <p style="font-size:13px;">なまえ: <b id="meName"></b></p>
      <input type="text" id="renameInput" maxlength="12" placeholder="新しいなまえ">
      <br><br>
      <button class="btn secondary" id="renameBtn">なまえを変える</button>
    </div>
  </section>
</main>

<nav>
  <button data-s="s-home" class="active"><div>🏠</div>ホーム</button>
  <button data-s="s-ufo"><div>🕹️</div>UFO</button>
  <button data-s="s-gacha"><div>🎰</div>ガチャ</button>
  <button data-s="s-dex"><div>📖</div>図鑑</button>
  <button data-s="s-trade"><div>🔁</div>トレード</button>
  <button data-s="s-me"><div>👤</div>マイ</button>
</nav>
</div>

<div class="toast" id="toast"></div>

// バリアント: normal(通常) / color(単色レア) / rainbow(激レア)
const COLOR_VARIANTS = [
  {key:"red", label:"レッド", css:"hue-rotate(0deg) saturate(6) brightness(0.9)"},
  {key:"blue", label:"ブルー", css:"hue-rotate(200deg) saturate(6) brightness(0.9)"},
  {key:"green", label:"グリーン", css:"hue-rotate(100deg) saturate(6) brightness(0.9)"},
  {key:"purple", label:"パープル", css:"hue-rotate(270deg) saturate(6) brightness(0.9)"},
  {key:"gold", label:"ゴールド", css:"sepia(1) saturate(6) hue-rotate(0deg) brightness(1.1)"},
];
function variantFilter(v){
  if(v==="normal") return "none";
  if(v==="rainbow") return "hue-rotate(0deg) saturate(3)"; // + animated overlay via class
  const c = COLOR_VARIANTS.find(x=>x.key===v);
  return c ? c.css : "none";
}
function variantLabel(v){
  if(v==="normal") return "ノーマル";
  if(v==="rainbow") return "レインボー";
  const c = COLOR_VARIANTS.find(x=>x.key===v);
  return c ? c.label : v;
}
const ALL_VARIANTS = ["normal", ...COLOR_VARIANTS.map(c=>c.key), "rainbow"];
function cardKey(charId, variant){ return charId+"_"+variant; }

// ガチャ確率テーブル（合計1000）
function rollVariant(){
  const r = Math.random()*1000;
  if(r < 850) return "normal";        // 85%
  if(r < 850+140) return COLOR_VARIANTS[Math.floor(Math.random()*COLOR_VARIANTS.length)].key; // 14%
  return "rainbow";                    // 1%
}

let uid = null, userData = null, statsCache = {};

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

// ==== 認証 ====
auth.onAuthStateChanged(async (user)=>{
  if(user){
    uid = user.uid;
    const doc = await db.collection('users').doc(uid).get();
    if(doc.exists){
      userData = doc.data();
      initApp();
    } else {
      document.getElementById('loginWrap').style.display='flex';
    }
  } else {
    auth.signInAnonymously().catch(e=>toast('ログイン失敗: '+e.message));
  }
});

document.getElementById('startBtn').onclick = async ()=>{
  const name = document.getElementById('unameInput').value.trim();
  if(!name){ toast('なまえを入力してね'); return; }
  userData = {username:name, gems:50, owned:{}, createdAt: Date.now()};
  await db.collection('users').doc(uid).set(userData);
  document.getElementById('loginWrap').style.display='none';
  initApp();
};

function initApp(){
  document.getElementById('app').style.display='block';
  document.getElementById('welcomeMsg').textContent = `ようこそ、${userData.username}さん！`;
  document.getElementById('meName').textContent = userData.username;
  renderGems();
  listenStats();
  renderDex();
  buildTradeSelects();
  listenTrades();
}

function renderGems(){ document.getElementById('gemCount').textContent = userData.gems; }

async function saveUser(){
  await db.collection('users').doc(uid).set(userData, {merge:true});
}

// ==== ナビ ====
document.querySelectorAll('nav button').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.s).classList.add('active');
    if(btn.dataset.s==='s-dex') renderDex();
    if(btn.dataset.s==='s-trade') buildTradeSelects();
  };
});

// ==== UFOキャッチャー ====
let ufoBusy = false;
document.getElementById('grabBtn').onclick = async ()=>{
  if(ufoBusy) return;
  ufoBusy = true;
  const btn = document.getElementById('grabBtn');
  btn.disabled = true;
  const claw = document.getElementById('claw');
  const head = document.getElementById('clawHead');
  claw.style.height = '150px';
  head.style.top = '150px';
  await new Promise(r=>setTimeout(r,650));
  const success = Math.random() < 0.42;
  const prizeImg = document.getElementById('ufoPrizeImg');
  if(success){
    const c = CHARS[Math.floor(Math.random()*CHARS.length)];
    prizeImg.src = c.img;
    prizeImg.style.display='block';
    head.textContent = '🦾✨';
  } else {
    head.textContent = '🦾💦';
  }
  await new Promise(r=>setTimeout(r,500));
  claw.style.height = '40px';
  head.style.top = '40px';
  prizeImg.style.display='none';
  if(success){
    const gain = 5 + Math.floor(Math.random()*11); // 5-15
    userData.gems += gain;
    renderGems(); await saveUser();
    toast(`ゲット！💎+${gain}`);
  } else {
    toast('あー！おしい…！');
  }
  head.textContent = '🦾';
  btn.disabled = false;
  ufoBusy = false;
};

// ==== ガチャ ====
let gachaBusy = false;
document.getElementById('gachaBtn').onclick = async ()=>{
  if(gachaBusy) return;
  if(userData.gems < 10){ toast('ジェムが足りないよ！UFOで稼ごう'); return; }
  gachaBusy = true;
  const btn = document.getElementById('gachaBtn');
  btn.disabled = true;
  userData.gems -= 10; renderGems(); await saveUser();

  const resImg = document.getElementById('gachaResult');
  const flash = document.getElementById('gachaFlash');
  const rays = document.getElementById('gachaRays');
  const tag = document.getElementById('rarityTag');
  resImg.style.opacity='0'; resImg.style.transform='scale(.3) rotate(-15deg)';
  resImg.className=''; tag.style.opacity='0';
  rays.style.opacity='0'; rays.style.animation='none';

  const char = CHARS[Math.floor(Math.random()*CHARS.length)];
  const variant = rollVariant();
  resImg.src = char.img;
  resImg.style.filter = variantFilter(variant);

  rays.style.opacity='1'; rays.style.animation='spin 3s linear infinite';
  flash.style.animation='none'; void flash.offsetWidth; flash.style.animation='flashAnim .5s ease';
  await new Promise(r=>setTimeout(r,350));
  resImg.style.transition='transform .6s cubic-bezier(.2,1.6,.4,1), opacity .3s';
  resImg.style.opacity='1'; resImg.style.transform='scale(1) rotate(0)';
  if(variant==='rainbow') resImg.classList.add('v-rainbow-glow');
  tag.textContent = variantLabel(variant);
  tag.style.background = variant==='normal' ? '#666' : variant==='rainbow' ? 'linear-gradient(90deg,red,orange,yellow,green,blue,violet)' : (COLOR_VARIANTS.find(c=>c.key===variant)||{}).key;
  tag.style.color = '#000';
  tag.style.opacity='1';

  // 保存
  const key = cardKey(char.id, variant);
  userData.owned[key] = (userData.owned[key]||0) + 1;
  await saveUser();
  // グローバル存在数カウント（transaction）
  const statRef = db.collection('stats').doc(key);
  db.runTransaction(async (tx)=>{
    const d = await tx.get(statRef);
    const cur = d.exists ? (d.data().total||0) : 0;
    tx.set(statRef, {total: cur+1}, {merge:true});
  }).catch(()=>{});

  toast(`${char.name}（${variantLabel(variant)}）をゲット！`);
  await new Promise(r=>setTimeout(r,300));
  rays.style.animation='none'; rays.style.opacity='0';
  btn.disabled = false;
  gachaBusy = false;
};

// ==== 図鑑（存在数リアルタイム） ====
function listenStats(){
  db.collection('stats').onSnapshot(snap=>{
    snap.forEach(d=>{ statsCache[d.id] = d.data().total || 0; });
    renderDex();
    updateHomeStats();
  });
}
function updateHomeStats(){
  const ownedTotal = Object.values(userData.owned||{}).reduce((a,b)=>a+b,0);
  document.getElementById('ownedTotal').textContent = ownedTotal;
  document.getElementById('allTotal').textContent = CHARS.length * ALL_VARIANTS.length;
}
function renderDex(){
  const grid = document.getElementById('dexGrid');
  grid.innerHTML = '';
  CHARS.forEach(char=>{
    ALL_VARIANTS.forEach(v=>{
      const key = cardKey(char.id, v);
      const owned = (userData.owned && userData.owned[key]) || 0;
      const total = statsCache[key] || 0;
      const div = document.createElement('div');
      div.className = 'dex-item ' + (owned>0? (v==='normal'?'v-normal':v==='rainbow'?'v-rainbow':'v-color') : 'locked');
      if(v!=='normal' && v!=='rainbow'){
        const cc = COLOR_VARIANTS.find(c=>c.key===v);
        div.style.setProperty('--v-color', cc? '#'+({red:'ff5f5f',blue:'5faaff',green:'5fff8f',purple:'c95fff',gold:'ffd54a'}[cc.key]) : '#888');
      }
      const img = document.createElement('img');
      img.src = char.img;
      if(owned>0) img.style.filter = variantFilter(v);
      div.appendChild(img);
      const nm = document.createElement('div'); nm.className='nm';
      nm.textContent = owned>0 ? `${char.name}` : '？？？';
      div.appendChild(nm);
      const cnt = document.createElement('div'); cnt.className='cnt';
      cnt.textContent = `${variantLabel(v)} ${owned}/${total}`;
      div.appendChild(cnt);
      grid.appendChild(div);
    });
  });
  updateHomeStats();
}

// ==== トレード ====
function ownedCardOptions(){
  const opts = [];
  Object.keys(userData.owned||{}).forEach(key=>{
    if(userData.owned[key] > 0){
      const [cid, v] = key.split('_');
      const c = CHARS.find(x=>x.id===cid);
      if(c) opts.push({key, label:`${c.name}（${variantLabel(v)}） 所持${userData.owned[key]}`});
    }
  });
  return opts;
}
function allCardOptions(){
  const opts = [];
  CHARS.forEach(c=> ALL_VARIANTS.forEach(v=> opts.push({key:cardKey(c.id,v), label:`${c.name}（${variantLabel(v)}）`})));
  return opts;
}
function buildTradeSelects(){
  const offerSel = document.getElementById('tradeOfferSelect');
  const wantSel = document.getElementById('tradeWantSelect');
  const mine = ownedCardOptions();
  offerSel.innerHTML = mine.length? mine.map(o=>`<option value="${o.key}">出す: ${o.label}</option>`).join('') : '<option value="">出せるカードがありません</option>';
  wantSel.innerHTML = allCardOptions().map(o=>`<option value="${o.key}">欲しい: ${o.label}</option>`).join('');
}
document.getElementById('tradePostBtn').onclick = async ()=>{
  const offerKey = document.getElementById('tradeOfferSelect').value;
  const wantKey = document.getElementById('tradeWantSelect').value;
  if(!offerKey){ toast('出せるカードがありません'); return; }
  if((userData.owned[offerKey]||0) < 1){ toast('そのカードは持っていません'); return; }
  await db.collection('trades').add({
    fromUid: uid, fromName: userData.username,
    offerKey, wantKey, status:'open', createdAt: Date.now()
  });
  toast('出品しました！');
};
function listenTrades(){
  db.collection('trades').where('status','==','open').onSnapshot(snap=>{
    const list = document.getElementById('tradeList');
    list.innerHTML = '';
    snap.forEach(doc=>{
      const t = doc.data();
      const [ocid, ov] = t.offerKey.split('_');
      const oc = CHARS.find(x=>x.id===ocid);
      const div = document.createElement('div');
      div.className = 'trade-item';
      const img = document.createElement('img');
      img.src = oc ? oc.img : '';
      img.style.filter = variantFilter(ov);
      div.appendChild(img);
      const info = document.createElement('div'); info.className='info';
      const [wcid, wv] = t.wantKey.split('_');
      const wc = CHARS.find(x=>x.id===wcid);
      info.innerHTML = `<b style="color:#fff;">${t.fromName}</b>さんの出品<br>${oc?oc.name:''}（${variantLabel(ov)}）→ 希望: ${wc?wc.name:''}（${variantLabel(wv)}）`;
      div.appendChild(info);
      if(t.fromUid !== uid){
        const btn = document.createElement('button');
        btn.className='btn secondary'; btn.style.width='auto'; btn.style.fontSize='11px'; btn.style.padding='8px 10px';
        btn.textContent = '交換する';
        btn.onclick = ()=>acceptTrade(doc.id, t);
        div.appendChild(btn);
      } else {
        const btn = document.createElement('button');
        btn.className='btn secondary'; btn.style.width='auto'; btn.style.fontSize='11px'; btn.style.padding='8px 10px';
        btn.textContent = '取り消す';
        btn.onclick = ()=> db.collection('trades').doc(doc.id).update({status:'cancelled'});
        div.appendChild(btn);
      }
      list.appendChild(div);
    });
  });
}
async function acceptTrade(tradeId, t){
  if((userData.owned[t.wantKey]||0) < 1){ toast('希望されているカードを持っていません'); return; }
  try{
    await db.runTransaction(async (tx)=>{
      const tradeRef = db.collection('trades').doc(tradeId);
      const tdoc = await tx.get(tradeRef);
      if(!tdoc.exists || tdoc.data().status !== 'open') throw new Error('この出品はもう成立しています');
      const fromRef = db.collection('users').doc(t.fromUid);
      const fromDoc = await tx.get(fromRef);
      if(!fromDoc.exists) throw new Error('相手が見つかりません');
      const fromData = fromDoc.data();
      if((fromData.owned[t.offerKey]||0) < 1) throw new Error('相手はもうそのカードを持っていません');
      // 相手：出品カードを減らし、希望カードを増やす
      fromData.owned[t.offerKey] = (fromData.owned[t.offerKey]||0) - 1;
      fromData.owned[t.wantKey] = (fromData.owned[t.wantKey]||0) + 1;
      tx.set(fromRef, fromData, {merge:true});
      // 自分：希望カードを減らし、出品カードを増やす
      userData.owned[t.wantKey] = (userData.owned[t.wantKey]||0) - 1;
      userData.owned[t.offerKey] = (userData.owned[t.offerKey]||0) + 1;
      const myRef = db.collection('users').doc(uid);
      tx.set(myRef, userData, {merge:true});
      tx.update(tradeRef, {status:'done'});
    });
    renderGems(); renderDex(); buildTradeSelects();
    toast('トレード成立！🎉');
  }catch(e){ toast('失敗: '+e.message); }
}

// ==== マイページ ====
document.getElementById('renameBtn').onclick = async ()=>{
  const name = document.getElementById('renameInput').value.trim();
  if(!name){ toast('なまえを入力してね'); return; }
  userData.username = name;
  await saveUser();
  document.getElementById('meName').textContent = name;
  document.getElementById('renameInput').value='';
  toast('なまえを変えました');
};
</script>
