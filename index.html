<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>なんでもコレクション</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg-deep:#0d0b26;
  --bg-panel:#161335;
  --bg-card:#1f1c47;
  --accent-gold:#ffd166;
  --accent-pink:#ff5d8f;
  --accent-blue:#4fd6ff;
  --text-main:#f4f2ff;
  --text-sub:#9a95c9;
  --line:#322d63;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:'M PLUS Rounded 1c',system-ui,sans-serif;
  background:radial-gradient(circle at 20% -10%,#2a2264 0%,var(--bg-deep) 55%);
  color:var(--text-main);
  min-height:100%;
  padding-bottom:78px;
}
header.top{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;
  background:rgba(13,11,38,.9);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
}
header.top h1{font-size:18px;margin:0;font-weight:900;letter-spacing:.02em;}
.currency-pill{
  display:flex;align-items:center;gap:6px;
  background:var(--bg-card);border:1px solid var(--line);
  padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px;
}
.currency-pill .coin{
  width:16px;height:16px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff5cf,var(--accent-gold) 60%,#c98f1c);
}
main{max-width:520px;margin:0 auto;padding:16px;}
.screen{display:none;animation:fadein .25s ease;}
.screen.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

h2.section-title{font-size:16px;margin:0 0 12px;color:var(--text-sub);font-weight:700;}

/* ---- ホーム / UFOキャッチャー ---- */
.crane-box{
  background:var(--bg-panel);border:1px solid var(--line);border-radius:20px;
  padding:18px;position:relative;overflow:hidden;
}
.crane-stage{
  height:220px;border-radius:14px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#241f5c,#100e30 75%);
  border:1px solid var(--line);margin-bottom:14px;
}
.crane-rail{position:absolute;top:14px;left:0;right:0;height:4px;background:#403a86;}
.crane-claw{
  position:absolute;top:14px;width:6px;background:#8f88d6;
  transform-origin:top center;transition:left .05s linear;
}
.crane-claw .head{
  position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);
  font-size:22px;
}
.prize-row{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:space-around;font-size:26px;}
.crane-result{
  text-align:center;font-weight:700;min-height:22px;margin-bottom:10px;color:var(--accent-gold);
}
button{
  font-family:inherit;border:none;cursor:pointer;border-radius:14px;
  font-weight:700;transition:transform .08s ease,filter .15s ease;
}
button:active{transform:scale(.96);}
button:disabled{opacity:.45;cursor:default;transform:none;}
.btn-primary{
  width:100%;padding:14px;font-size:16px;
  background:linear-gradient(135deg,var(--accent-pink),#ff8a5d);
  color:#1a0a12;
}
.btn-secondary{
  padding:10px 16px;font-size:14px;background:var(--bg-card);color:var(--text-main);border:1px solid var(--line);
}
.hint{font-size:12px;color:var(--text-sub);text-align:center;margin-top:8px;}

/* ---- ガチャ ---- */
.gacha-box{background:var(--bg-panel);border:1px solid var(--line);border-radius:20px;padding:20px;text-align:center;}
.gacha-machine{
  width:150px;height:150px;margin:0 auto 16px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#4c4590,#1c1846 70%);
  display:flex;align-items:center;justify-content:center;font-size:56px;
  border:3px solid var(--line);
  box-shadow:0 0 0 6px rgba(255,209,102,.08);
}
.gacha-machine.shake{animation:shake .5s ease;}
@keyframes shake{
  0%,100%{transform:rotate(0);}
  20%{transform:rotate(-8deg);}
  40%{transform:rotate(8deg);}
  60%{transform:rotate(-6deg);}
  80%{transform:rotate(6deg);}
}
.gacha-buttons{display:flex;gap:10px;margin-top:14px;}
.result-overlay{
  position:fixed;inset:0;z-index:100;background:rgba(6,5,20,.92);
  display:none;align-items:center;justify-content:center;flex-direction:column;padding:24px;
}
.result-overlay.show{display:flex;}
.result-card{
  width:220px;padding:26px 18px;border-radius:20px;text-align:center;
  background:var(--bg-card);border:2px solid var(--line);position:relative;
  animation:pop .5s cubic-bezier(.2,1.6,.4,1);
}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
.result-card .emoji{font-size:64px;display:block;margin-bottom:10px;}
.result-card .name{font-weight:900;font-size:17px;margin-bottom:6px;}
.result-card .rarity-tag{
  display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;
}
.result-card.rainbow{border-image:linear-gradient(90deg,#ff5d8f,#ffd166,#4fd6ff,#8f5dff,#ff5d8f) 1;animation:pop .5s cubic-bezier(.2,1.6,.4,1), rainbowglow 1.6s linear infinite;}
@keyframes rainbowglow{
  0%{box-shadow:0 0 30px 4px rgba(255,93,143,.6);}
  33%{box-shadow:0 0 30px 4px rgba(79,214,255,.6);}
  66%{box-shadow:0 0 30px 4px rgba(143,93,255,.6);}
  100%{box-shadow:0 0 30px 4px rgba(255,93,143,.6);}
}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:101;}
.confetti span{
  position:absolute;top:-10px;width:8px;height:14px;opacity:.9;
  animation:fall linear forwards;
}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:0;}}

/* ---- 図鑑 ---- */
.zukan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.zukan-card{
  background:var(--bg-card);border:1px solid var(--line);border-radius:14px;
  padding:10px 6px;text-align:center;
}
.zukan-card .emoji{font-size:30px;display:block;margin-bottom:4px;filter:none;}
.zukan-card.locked .emoji{filter:grayscale(1) brightness(.35);}
.zukan-card .name{font-size:11px;font-weight:700;margin-bottom:3px;min-height:14px;}
.zukan-card.locked .name{color:var(--text-sub);}
.zukan-card .counts{font-size:10px;color:var(--text-sub);}
.filter-row{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;}
.filter-chip{
  padding:6px 12px;font-size:12px;background:var(--bg-card);color:var(--text-sub);
  border:1px solid var(--line);white-space:nowrap;
}
.filter-chip.active{background:var(--accent-pink);color:#1a0a12;border-color:var(--accent-pink);}

/* ---- トレード ---- */
.trade-form{background:var(--bg-panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px;}
.trade-form label{font-size:12px;color:var(--text-sub);display:block;margin:8px 0 4px;}
select,input[type=number],input[type=text]{
  width:100%;padding:10px;border-radius:10px;background:var(--bg-card);border:1px solid var(--line);
  color:var(--text-main);font-family:inherit;font-size:14px;
}
.trade-card{
  background:var(--bg-card);border:1px solid var(--line);border-radius:14px;
  padding:12px;margin-bottom:10px;display:flex;align-items:center;gap:10px;
}
.trade-card .swap{font-size:20px;}
.trade-card .who{font-size:11px;color:var(--text-sub);margin-top:4px;}
.trade-card .side{flex:1;text-align:center;}
.trade-card .side .emoji{font-size:28px;}
.trade-card .side .qty{font-size:12px;font-weight:700;}
.trade-card button{padding:8px 10px;font-size:12px;}
.empty{text-align:center;color:var(--text-sub);font-size:13px;padding:24px 0;}

/* ---- 設定 ---- */
.settings-box{background:var(--bg-panel);border:1px solid var(--line);border-radius:16px;padding:16px;}
.settings-box label{font-size:12px;color:var(--text-sub);display:block;margin-bottom:6px;}

nav.bottom{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  display:flex;background:rgba(13,11,38,.95);backdrop-filter:blur(6px);
  border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
}
nav.bottom button{
  flex:1;background:none;color:var(--text-sub);padding:8px 2px;font-size:11px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
nav.bottom button .ic{font-size:19px;}
nav.bottom button.active{color:var(--accent-gold);}

.modal-bg{position:fixed;inset:0;background:rgba(6,5,20,.85);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-bg.show{display:flex;}
.modal-box{background:var(--bg-panel);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:320px;width:100%;text-align:center;}
.modal-box h3{margin:0 0 10px;}
.modal-box p{font-size:13px;color:var(--text-sub);margin-bottom:14px;}

:root:not([data-theme="light"]){color-scheme:dark;}
</style>
</head>
<body>

<header class="top">
  <h1>なんでもコレクション</h1>
  <div class="currency-pill"><span class="coin"></span><span id="currencyDisplay">0</span></div>
</header>

<main>

  <!-- ホーム: UFOキャッチャー -->
  <section class="screen active" id="screen-home">
    <h2 class="section-title">UFOキャッチャー(通貨ゲット)</h2>
    <div class="crane-box">
      <div class="crane-stage" id="craneStage">
        <div class="crane-rail"></div>
        <div class="crane-claw" id="craneClaw" style="left:20px;height:20px;">
          <div class="head">🪝</div>
        </div>
        <div class="prize-row" id="prizeRow"></div>
      </div>
      <div class="crane-result" id="craneResult">ボタンを押してアームを止めよう!</div>
      <button class="btn-primary" id="craneBtn">キャッチ!</button>
      <div class="hint">何回でも挑戦OK。景品の真上で止めると成功率アップ。</div>
    </div>
  </section>

  <!-- ガチャ -->
  <section class="screen" id="screen-gacha">
    <h2 class="section-title">ガチャ (1回 100 コイン)</h2>
    <div class="gacha-box">
      <div class="gacha-machine" id="gachaMachine">🎰</div>
      <div class="gacha-buttons">
        <button class="btn-primary" id="gachaBtn1" style="flex:1">1回引く</button>
        <button class="btn-secondary" id="gachaBtn10" style="flex:1">10連 (980)</button>
      </div>
      <div class="hint">ノーマル(よく出る) → カラー(単色・レア) → レインボー(超激レア)</div>
    </div>
  </section>

  <!-- 図鑑 -->
  <section class="screen" id="screen-zukan">
    <h2 class="section-title">図鑑</h2>
    <div class="filter-row" id="zukanFilters"></div>
    <div class="zukan-grid" id="zukanGrid"></div>
  </section>

  <!-- トレード -->
  <section class="screen" id="screen-trade">
    <h2 class="section-title">トレード出品</h2>
    <div class="trade-form">
      <label>渡すキャラ(所持しているもの)</label>
      <select id="tradeOfferChar"></select>
      <label>渡す個数</label>
      <input type="number" id="tradeOfferQty" min="1" value="1">
      <label>欲しいキャラ</label>
      <select id="tradeWantChar"></select>
      <label>欲しい個数</label>
      <input type="number" id="tradeWantQty" min="1" value="1">
      <button class="btn-primary" id="tradeCreateBtn" style="margin-top:12px;">出品する</button>
    </div>
    <h2 class="section-title">出品中のトレード</h2>
    <div id="tradeList"></div>
  </section>

  <!-- 設定 -->
  <section class="screen" id="screen-settings">
    <h2 class="section-title">ユーザー設定</h2>
    <div class="settings-box">
      <label>ユーザーネーム</label>
      <input type="text" id="usernameInput" maxlength="14">
      <button class="btn-primary" id="usernameSaveBtn" style="margin-top:12px;">保存する</button>
      <p class="hint" id="uidDisplay" style="margin-top:14px;"></p>
    </div>
  </section>

</main>

<nav class="bottom">
  <button class="nav-btn active" data-screen="home"><span class="ic">🕹️</span>ホーム</button>
  <button class="nav-btn" data-screen="gacha"><span class="ic">🎰</span>ガチャ</button>
  <button class="nav-btn" data-screen="zukan"><span class="ic">📖</span>図鑑</button>
  <button class="nav-btn" data-screen="trade"><span class="ic">🔁</span>トレード</button>
  <button class="nav-btn" data-screen="settings"><span class="ic">⚙️</span>設定</button>
</nav>

<div class="result-overlay" id="resultOverlay">
  <div class="result-card" id="resultCard">
    <span class="emoji" id="resultEmoji"></span>
    <div class="name" id="resultName"></div>
    <span class="rarity-tag" id="resultRarityTag"></span>
  </div>
  <button class="btn-secondary" id="resultCloseBtn" style="margin-top:22px;">閉じる</button>
</div>

<div class="modal-bg" id="usernameModal">
  <div class="modal-box">
    <h3>ようこそ!</h3>
    <p>コレクションで使うユーザーネームを決めてください</p>
    <input type="text" id="usernameModalInput" maxlength="14" placeholder="例: たろう">
    <button class="btn-primary" id="usernameModalSave" style="margin-top:14px;">はじめる</button>
  </div>
</div>

<script>
/* ===================== Firebase 初期化 ===================== */
const firebaseConfig = {
  apiKey: "AIzaSyBAjqK2MDDptqzhH_-J4TmPF8beXFgQJ9M",
  authDomain: "hiraikun2.firebaseapp.com",
  projectId: "hiraikun2",
  storageBucket: "hiraikun2.firebasestorage.app",
  messagingSenderId: "441487054471",
  appId: "1:441487054471:web:0cbab1e6723721deef0a22",
  measurementId: "G-HRLMZH4ZSP"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let uid = null;
let userDoc = null;           // {username, currency}
let userCollection = {};      // {charId: count}
let allCharacters = [];       // [{id, name, rarity, colorHex, emoji, totalMinted}]
let currentFilter = 'all';

/* ===================== レアリティ定義 ===================== */
const RARITY_INFO = {
  normal:  {label:'ノーマル',  color:'#b9b6e0', weightTier:75},
  red:     {label:'カラー(赤)', color:'#ff5d5d', weightTier:23/5},
  blue:    {label:'カラー(青)', color:'#4fd6ff', weightTier:23/5},
  green:   {label:'カラー(緑)', color:'#5dffa0', weightTier:23/5},
  yellow:  {label:'カラー(黄)', color:'#ffe45d', weightTier:23/5},
  purple:  {label:'カラー(紫)', color:'#b95dff', weightTier:23/5},
  rainbow: {label:'レインボー', color:'#ffd166', weightTier:2},
};
const COLOR_TIERS = ['red','blue','green','yellow','purple'];

const SEED_CHARACTERS = [
  ...['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵'].map((e,i)=>({name:'どうぶつ'+(i+1),rarity:'normal',emoji:e})),
  ...COLOR_TIERS.flatMap(c => [1,2,3].map(n => ({
    name:{red:'あか',blue:'あお',green:'みどり',yellow:'きいろ',purple:'むらさき'}[c]+'のせいれい'+n,
    rarity:c,
    emoji: {red:'🔴',blue:'🔵',green:'🟢',yellow:'🟡',purple:'🟣'}[c]
  }))),
  {name:'にじのりゅう',rarity:'rainbow',emoji:'🐲'},
  {name:'にじのふぉにっくす',rarity:'rainbow',emoji:'🔥'},
  {name:'にじのゆにこーん',rarity:'rainbow',emoji:'🦄'},
];

/* ===================== 起動 ===================== */
auth.onAuthStateChanged(async (user) => {
  if (!user) { auth.signInAnonymously(); return; }
  uid = user.uid;
  await ensureCharacterSeed();
  await loadCharacters();
  await loadUserDoc();
  await loadUserCollection();
  refreshCurrencyDisplay();
  renderZukanFilters();
  renderZukan();
  renderTradeSelects();
  loadTrades();
  buildCraneStage();
});

async function ensureCharacterSeed(){
  const snap = await db.collection('characters').limit(1).get();
  if (!snap.empty) return;
  const batch = db.batch();
  SEED_CHARACTERS.forEach(c => {
    const ref = db.collection('characters').doc();
    batch.set(ref, {...c, totalMinted:0});
  });
  await batch.commit();
}

async function loadCharacters(){
  const snap = await db.collection('characters').get();
  allCharacters = snap.docs.map(d => ({id:d.id, ...d.data()}));
}

async function loadUserDoc(){
  const ref = db.collection('users').doc(uid);
  const snap = await ref.get();
  if (!snap.exists){
    userDoc = {username:'', currency:500};
    await ref.set(userDoc);
    document.getElementById('usernameModal').classList.add('show');
  } else {
    userDoc = snap.data();
    if (!userDoc.username) document.getElementById('usernameModal').classList.add('show');
  }
  document.getElementById('usernameInput').value = userDoc.username || '';
  document.getElementById('uidDisplay').textContent = 'ID: ' + uid.slice(0,10) + '…';
}

async function loadUserCollection(){
  const snap = await db.collection('users').doc(uid).collection('collection').get();
  userCollection = {};
  snap.docs.forEach(d => userCollection[d.id] = d.data().count);
}

function refreshCurrencyDisplay(){
  document.getElementById('currencyDisplay').textContent = userDoc.currency;
}

/* ===================== ナビゲーション ===================== */
document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById('screen-'+btn.dataset.screen).classList.add('active');
    if (btn.dataset.screen==='trade'){ renderTradeSelects(); loadTrades(); }
    if (btn.dataset.screen==='zukan'){ renderZukan(); }
  });
});

/* ===================== ユーザーネーム ===================== */
async function saveUsername(name){
  name = name.trim();
  if (!name) return;
  userDoc.username = name;
  await db.collection('users').doc(uid).set({username:name}, {merge:true});
}
document.getElementById('usernameModalSave').addEventListener('click', async ()=>{
  const v = document.getElementById('usernameModalInput').value;
  if (!v.trim()) return;
  await saveUsername(v);
  document.getElementById('usernameInput').value = v.trim();
  document.getElementById('usernameModal').classList.remove('show');
});
document.getElementById('usernameSaveBtn').addEventListener('click', async ()=>{
  await saveUsername(document.getElementById('usernameInput').value);
  document.getElementById('usernameSaveBtn').textContent = '保存しました!';
  setTimeout(()=>document.getElementById('usernameSaveBtn').textContent='保存する',1200);
});

/* ===================== UFOキャッチャー ===================== */
const PRIZES = ['🪙','💰','🎁','💎'];
function buildCraneStage(){
  const row = document.getElementById('prizeRow');
  row.innerHTML = PRIZES.map(()=>`<span>${PRIZES[Math.floor(Math.random()*PRIZES.length)]}</span>`).join('');
}
let clawPos = 0, clawDir = 1, clawTimer = null, craneLocked = false;
function startClaw(){
  const stage = document.getElementById('craneStage');
  const claw = document.getElementById('craneClaw');
  clawTimer = setInterval(()=>{
    const max = stage.clientWidth - 26;
    clawPos += clawDir * 4;
    if (clawPos >= max){clawPos = max; clawDir = -1;}
    if (clawPos <= 0){clawPos = 0; clawDir = 1;}
    claw.style.left = clawPos + 'px';
  }, 16);
}
startClaw();

document.getElementById('craneBtn').addEventListener('click', async ()=>{
  if (craneLocked) return;
  craneLocked = true;
  clearInterval(clawTimer);
  const btn = document.getElementById('craneBtn');
  const claw = document.getElementById('craneClaw');
  const stage = document.getElementById('craneStage');
  btn.disabled = true;

  // 掴みに行くアニメーション
  claw.style.transition = 'height .4s ease';
  claw.style.height = '150px';
  await sleep(450);

  // 中央への近さで成功率を決める(単純なミニゲーム性)
  const center = stage.clientWidth/2;
  const dist = Math.abs((clawPos+13) - center);
  const successChance = Math.max(0.15, 0.85 - dist/ (stage.clientWidth/2) * 0.7);
  const success = Math.random() < successChance;

  claw.style.height = '20px';
  await sleep(400);

  if (success){
    const reward = 15 + Math.floor(Math.random()*90);
    userDoc.currency += reward;
    await db.collection('users').doc(uid).set({currency:userDoc.currency}, {merge:true});
    refreshCurrencyDisplay();
    document.getElementById('craneResult').textContent = `やった!${reward} コイン ゲット!`;
    document.getElementById('craneResult').style.color = 'var(--accent-gold)';
  } else {
    document.getElementById('craneResult').textContent = 'あーん、逃げられた…もう一度!';
    document.getElementById('craneResult').style.color = 'var(--text-sub)';
  }

  claw.style.transition = '';
  buildCraneStage();
  startClaw();
  await sleep(400);
  btn.disabled = false;
  craneLocked = false;
});

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

/* ===================== ガチャ ===================== */
function pickRarity(){
  const tiers = Object.entries(RARITY_INFO).filter(([k])=>k!=='rainbow' && !COLOR_TIERS.includes(k));
  // build weighted pool: normal(75) + each color(23/5) + rainbow(2)
  const pool = [['normal', RARITY_INFO.normal.weightTier]];
  COLOR_TIERS.forEach(c => pool.push([c, RARITY_INFO[c].weightTier]));
  pool.push(['rainbow', RARITY_INFO.rainbow.weightTier]);
  const total = pool.reduce((s,[,w])=>s+w,0);
  let r = Math.random()*total;
  for (const [key,w] of pool){
    if (r < w) return key;
    r -= w;
  }
  return 'normal';
}
function pickCharacterOfRarity(rarity){
  const list = allCharacters.filter(c=>c.rarity===rarity);
  if (!list.length) return allCharacters[Math.floor(Math.random()*allCharacters.length)];
  return list[Math.floor(Math.random()*list.length)];
}
async function drawGacha(cost){
  if (userDoc.currency < cost){
    alert('コインが足りません!UFOキャッチャーで稼ごう。');
    return null;
  }
  userDoc.currency -= cost;
  await db.collection('users').doc(uid).set({currency:userDoc.currency}, {merge:true});
  refreshCurrencyDisplay();

  const rarity = pickRarity();
  const char = pickCharacterOfRarity(rarity);

  // 所持数 +1
  const newCount = (userCollection[char.id]||0) + 1;
  userCollection[char.id] = newCount;
  await db.collection('users').doc(uid).collection('collection').doc(char.id).set({count:newCount});

  // 存在数(totalMinted) +1
  await db.collection('characters').doc(char.id).update({
    totalMinted: firebase.firestore.FieldValue.increment(1)
  });
  const localChar = allCharacters.find(c=>c.id===char.id);
  if (localChar) localChar.totalMinted = (localChar.totalMinted||0)+1;

  return char;
}

function showGachaResult(char){
  const card = document.getElementById('resultCard');
  card.classList.toggle('rainbow', char.rarity==='rainbow');
  document.getElementById('resultEmoji').textContent = char.emoji;
  document.getElementById('resultName').textContent = char.name;
  const tag = document.getElementById('resultRarityTag');
  tag.textContent = RARITY_INFO[char.rarity].label;
  tag.style.background = RARITY_INFO[char.rarity].color;
  tag.style.color = '#1a0a12';
  document.getElementById('resultOverlay').classList.add('show');
  if (char.rarity==='rainbow' || COLOR_TIERS.includes(char.rarity)) launchConfetti(char.rarity==='rainbow'?60:28);
}
document.getElementById('resultCloseBtn').addEventListener('click', ()=>{
  document.getElementById('resultOverlay').classList.remove('show');
  renderZukan();
});

function launchConfetti(n){
  const layer = document.createElement('div');
  layer.className = 'confetti';
  const colors = ['#ff5d8f','#ffd166','#4fd6ff','#8f5dff','#5dffa0'];
  for (let i=0;i<n;i++){
    const s = document.createElement('span');
    s.style.left = Math.random()*100+'vw';
    s.style.background = colors[Math.floor(Math.random()*colors.length)];
    s.style.animationDuration = (1.2+Math.random()*1.2)+'s';
    s.style.animationDelay = (Math.random()*0.4)+'s';
    layer.appendChild(s);
  }
  document.body.appendChild(layer);
  setTimeout(()=>layer.remove(), 3000);
}

async function playGachaAnimation(){
  const machine = document.getElementById('gachaMachine');
  machine.classList.add('shake');
  await sleep(550);
  machine.classList.remove('shake');
}

document.getElementById('gachaBtn1').addEventListener('click', async ()=>{
  const btns = [document.getElementById('gachaBtn1'), document.getElementById('gachaBtn10')];
  btns.forEach(b=>b.disabled=true);
  await playGachaAnimation();
  const char = await drawGacha(100);
  btns.forEach(b=>b.disabled=false);
  if (char) showGachaResult(char);
});

document.getElementById('gachaBtn10').addEventListener('click', async ()=>{
  const btns = [document.getElementById('gachaBtn1'), document.getElementById('gachaBtn10')];
  if (userDoc.currency < 980){ alert('コインが足りません!'); return; }
  btns.forEach(b=>b.disabled=true);
  await playGachaAnimation();
  let results = [];
  for (let i=0;i<10;i++){
    if (userDoc.currency < 98) break;
    userDoc.currency -= 98;
    const rarity = pickRarity();
    const char = pickCharacterOfRarity(rarity);
    const newCount = (userCollection[char.id]||0) + 1;
    userCollection[char.id] = newCount;
    await db.collection('users').doc(uid).collection('collection').doc(char.id).set({count:newCount});
    await db.collection('characters').doc(char.id).update({totalMinted: firebase.firestore.FieldValue.increment(1)});
    const lc = allCharacters.find(c=>c.id===char.id);
    if (lc) lc.totalMinted = (lc.totalMinted||0)+1;
    results.push(char);
  }
  await db.collection('users').doc(uid).set({currency:userDoc.currency}, {merge:true});
  refreshCurrencyDisplay();
  btns.forEach(b=>b.disabled=false);
  // 一番レアなキャラを演出表示、その後まとめて結果をアラート的に一覧
  results.sort((a,b)=> rarityRank(b.rarity)-rarityRank(a.rarity));
  if (results[0]) showGachaResult(results[0]);
  setTimeout(()=>{
    alert('10連の結果:\n' + results.map(c=>`${c.emoji} ${c.name} (${RARITY_INFO[c.rarity].label})`).join('\n'));
    renderZukan();
  }, 300);
});
function rarityRank(r){ return r==='rainbow'?3 : (COLOR_TIERS.includes(r)?2:1); }

/* ===================== 図鑑 ===================== */
function renderZukanFilters(){
  const el = document.getElementById('zukanFilters');
  const cats = [['all','すべて'],['normal','ノーマル'],['red','赤'],['blue','青'],['green','緑'],['yellow','黄'],['purple','紫'],['rainbow','レインボー']];
  el.innerHTML = cats.map(([k,l])=>`<button class="filter-chip ${k==='all'?'active':''}" data-f="${k}">${l}</button>`).join('');
  el.querySelectorAll('.filter-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      el.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      currentFilter = chip.dataset.f;
      renderZukan();
    });
  });
}
function renderZukan(){
  const grid = document.getElementById('zukanGrid');
  const list = allCharacters.filter(c => currentFilter==='all' || c.rarity===currentFilter)
    .sort((a,b)=> rarityRank(b.rarity)-rarityRank(a.rarity));
  grid.innerHTML = list.map(c=>{
    const owned = userCollection[c.id]||0;
    const locked = owned===0;
    return `<div class="zukan-card ${locked?'locked':''}">
      <span class="emoji">${locked?'❔':c.emoji}</span>
      <div class="name">${locked?'？？？':c.name}</div>
      <div class="counts">所持 ${owned} / 存在 ${c.totalMinted||0}</div>
    </div>`;
  }).join('');
}

/* ===================== トレード ===================== */
function renderTradeSelects(){
  const offerSel = document.getElementById('tradeOfferChar');
  const wantSel = document.getElementById('tradeWantChar');
  const owned = allCharacters.filter(c => (userCollection[c.id]||0) > 0);
  offerSel.innerHTML = owned.length
    ? owned.map(c=>`<option value="${c.id}">${c.emoji} ${c.name} (所持${userCollection[c.id]})</option>`).join('')
    : `<option value="">所持キャラがありません</option>`;
  wantSel.innerHTML = allCharacters.map(c=>`<option value="${c.id}">${c.emoji} ${c.name}</option>`).join('');
}

document.getElementById('tradeCreateBtn').addEventListener('click', async ()=>{
  const offerCharId = document.getElementById('tradeOfferChar').value;
  const offerQty = parseInt(document.getElementById('tradeOfferQty').value)||1;
  const wantCharId = document.getElementById('tradeWantChar').value;
  const wantQty = parseInt(document.getElementById('tradeWantQty').value)||1;
  if (!offerCharId){ alert('渡せるキャラがありません。'); return; }
  if ((userCollection[offerCharId]||0) < offerQty){ alert('所持数が足りません。'); return; }
  if (offerCharId === wantCharId){ alert('同じキャラは交換できません。'); return; }

  // エスクロー: 出品時に手元から引く
  const newCount = userCollection[offerCharId] - offerQty;
  userCollection[offerCharId] = newCount;
  await db.collection('users').doc(uid).collection('collection').doc(offerCharId).set({count:newCount});

  const offerChar = allCharacters.find(c=>c.id===offerCharId);
  const wantChar = allCharacters.find(c=>c.id===wantCharId);
  await db.collection('trades').add({
    fromUid: uid,
    fromUsername: userDoc.username || '名無し',
    offerCharId, offerQty, offerEmoji: offerChar.emoji, offerName: offerChar.name,
    wantCharId, wantQty, wantEmoji: wantChar.emoji, wantName: wantChar.name,
    status: 'open',
    createdAt: Date.now()
  });
  renderTradeSelects();
  renderZukan();
  loadTrades();
});

async function loadTrades(){
  const snap = await db.collection('trades').where('status','==','open').get();
  const list = document.getElementById('tradeList');
  const trades = snap.docs.map(d=>({id:d.id, ...d.data()}));
  if (!trades.length){ list.innerHTML = '<div class="empty">出品中のトレードはありません</div>'; return; }
  list.innerHTML = trades.map(t=>{
    const isMine = t.fromUid === uid;
    return `<div class="trade-card">
      <div class="side"><span class="emoji">${t.offerEmoji}</span><div class="qty">${t.offerName} ×${t.offerQty}</div></div>
      <div class="swap">🔁</div>
      <div class="side"><span class="emoji">${t.wantEmoji}</span><div class="qty">${t.wantName} ×${t.wantQty}</div></div>
      <div>
        <div class="who">${t.fromUsername}</div>
        ${isMine
          ? `<button class="btn-secondary" data-cancel="${t.id}">取消</button>`
          : `<button class="btn-primary" data-accept="${t.id}" style="padding:8px 10px;font-size:12px;">交換する</button>`}
      </div>
    </div>`;
  }).join('');
  list.querySelectorAll('[data-cancel]').forEach(b=>b.addEventListener('click', ()=>cancelTrade(b.dataset.cancel)));
  list.querySelectorAll('[data-accept]').forEach(b=>b.addEventListener('click', ()=>acceptTrade(b.dataset.accept)));
}

async function cancelTrade(tradeId){
  const ref = db.collection('trades').doc(tradeId);
  const snap = await ref.get();
  if (!snap.exists) return;
  const t = snap.data();
  if (t.fromUid !== uid) return;
  // 返却
  const newCount = (userCollection[t.offerCharId]||0) + t.offerQty;
  userCollection[t.offerCharId] = newCount;
  await db.collection('users').doc(uid).collection('collection').doc(t.offerCharId).set({count:newCount});
  await ref.update({status:'cancelled'});
  renderTradeSelects(); renderZukan(); loadTrades();
}

async function acceptTrade(tradeId){
  const ref = db.collection('trades').doc(tradeId);
  const snap = await ref.get();
  if (!snap.exists) return;
  const t = snap.data();
  if (t.fromUid === uid){ alert('自分の出品には交換できません。'); return; }
  if ((userCollection[t.wantCharId]||0) < t.wantQty){ alert('必要なキャラの所持数が足りません。'); return; }

  // 自分: 要求キャラを渡し、出品キャラを受け取る
  const myWantNew = userCollection[t.wantCharId] - t.wantQty;
  userCollection[t.wantCharId] = myWantNew;
  await db.collection('users').doc(uid).collection('collection').doc(t.wantCharId).set({count:myWantNew});

  const myOfferNew = (userCollection[t.offerCharId]||0) + t.offerQty;
  userCollection[t.offerCharId] = myOfferNew;
  await db.collection('users').doc(uid).collection('collection').doc(t.offerCharId).set({count:myOfferNew});

  // 相手: 要求キャラ(wantChar)を受け取る
  const otherWantRef = db.collection('users').doc(t.fromUid).collection('collection').doc(t.wantCharId);
  const otherWantSnap = await otherWantRef.get();
  const otherWantNew = (otherWantSnap.exists ? otherWantSnap.data().count : 0) + t.wantQty;
  await otherWantRef.set({count:otherWantNew});

  await ref.update({status:'completed', acceptedBy:uid});
  renderTradeSelects(); renderZukan(); loadTrades();
  alert('トレード成立!');
}
</script>
