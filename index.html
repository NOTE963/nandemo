<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>なんでもコレクション</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/firebase@8.10.1/firebase-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@8.10.1/firebase-auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@8.10.1/firebase-firestore.js"></script>
<style>
:root{
  --paper:#f7f3e9; --line:#c9d8e6; --ink:#2b2b2b; --accent:#e0622a;
  --gold:#e0b13a; --rainbow1:#ff5b5b; --rainbow2:#ffd166; --rainbow3:#6ee7b7; --rainbow4:#5b9bff; --rainbow5:#c17aff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#20242b; --line:#333a45; --ink:#eee6d6; }
}
:root[data-theme="dark"]{ --paper:#20242b; --line:#333a45; --ink:#eee6d6; }
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100%; background:var(--paper); color:var(--ink);
  font-family:'Zen Maru Gothic',sans-serif;
  background-image:repeating-linear-gradient(var(--paper) 0 31px, var(--line) 31px 32px);
}
h1,h2,.hand{font-family:'Kalam',cursive;}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 90px;}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:6px;}
h1{font-size:26px;margin:0;line-height:1.1;transform:rotate(-1deg);}
.pill{background:var(--ink);color:var(--paper);border-radius:20px;padding:6px 12px;font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.coin{color:var(--gold);}
.userbar{display:flex;align-items:center;gap:8px;margin:10px 0 4px;font-size:14px;}
.userbar input{border:none;border-bottom:2px solid var(--ink);background:transparent;color:var(--ink);font-family:inherit;font-size:14px;padding:2px 4px;width:120px;}
nav{display:flex;gap:6px;margin:14px 0;overflow-x:auto;}
nav button{flex:1;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:10px;padding:9px 4px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;}
nav button.active{background:var(--ink);color:var(--paper);}
.card{border:2px solid var(--ink);border-radius:14px;padding:16px;margin-bottom:14px;background:rgba(255,255,255,.35);position:relative;}
:root[data-theme="dark"] .card, @media (prefers-color-scheme:dark){.card{background:rgba(0,0,0,.15);}}
.btn{border:2px solid var(--ink);background:var(--accent);color:#fff;border-radius:10px;padding:12px 18px;font-weight:700;font-family:inherit;font-size:15px;cursor:pointer;width:100%;}
.btn.secondary{background:transparent;color:var(--ink);}
.btn:disabled{opacity:.4;}
.muted{opacity:.65;font-size:13px;}
/* gacha */
.machine{text-align:center;padding:10px 0 4px;}
.capsule{width:110px;height:110px;margin:0 auto 10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8,transparent 40%),conic-gradient(from 0deg,var(--rainbow1),var(--rainbow2),var(--rainbow3),var(--rainbow4),var(--rainbow5),var(--rainbow1));border:3px solid var(--ink);animation:spin 6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.gachaRow{display:flex;gap:8px;}
/* overlay reveal */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:50;flex-direction:column;}
#overlay.show{display:flex;}
.revealCard{width:230px;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:18px;text-align:center;transform:scale(.3);opacity:0;transition:transform .45s cubic-bezier(.2,1.6,.4,1),opacity .3s;}
.revealCard.pop{transform:scale(1);opacity:1;}
.revealCard img{width:150px;height:150px;object-fit:contain;border-radius:10px;background:#fff;}
.rarityTag{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:20px;font-weight:700;font-size:13px;}
.r-normal{background:#999;color:#fff;}
.r-color{background:var(--rc,#e0622a);color:#fff;}
.r-rainbow{background:conic-gradient(var(--rainbow1),var(--rainbow2),var(--rainbow3),var(--rainbow4),var(--rainbow5),var(--rainbow1));color:#fff;animation:huecyc 2s linear infinite;}
@keyframes huecyc{to{filter:hue-rotate(360deg);}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;}
.flash.go{animation:flashpop .5s ease;}
@keyframes flashpop{0%{opacity:1;}100%{opacity:0;}}
.confetti{position:fixed;top:-10px;width:8px;height:14px;z-index:60;}
/* dex grid */
.dexGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.dexCell{border:2px solid var(--ink);border-radius:10px;padding:6px;text-align:center;font-size:11px;background:rgba(255,255,255,.3);}
.dexCell img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:6px;background:#fff;}
.dexCell.locked img{filter:brightness(0) opacity(.85);}
.dexCell.locked{opacity:.55;}
.dexCell .cnt{font-weight:700;margin-top:2px;}
/* ufo */
.ufoArea{position:relative;height:260px;border:2px dashed var(--ink);border-radius:14px;overflow:hidden;background:repeating-linear-gradient(90deg,transparent 0 39px,rgba(0,0,0,.05) 39px 40px);}
.rail{position:absolute;top:10px;left:0;right:0;height:2px;background:var(--ink);}
.claw{position:absolute;top:10px;width:34px;height:34px;transform:translateX(-50%);transition:left .05s linear;}
.claw .arm{width:2px;height:0;background:var(--ink);margin:0 auto;}
.claw .hand{width:30px;height:22px;border:3px solid var(--ink);border-top:none;border-radius:0 0 12px 12px;margin:0 auto;background:var(--paper);}
.prizeRow{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:space-around;}
.prize{width:34px;height:34px;border-radius:50%;background:var(--gold);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:16px;}
.prize.target{box-shadow:0 0 0 3px var(--accent);}
/* trade */
.tradeItem{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:8px 0;}
.tradeItem img{width:42px;height:42px;border-radius:8px;object-fit:contain;background:#fff;border:1px solid var(--ink);}
select,input[type=number]{font-family:inherit;border:2px solid var(--ink);border-radius:8px;padding:6px;background:transparent;color:var(--ink);}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:20px;font-size:14px;z-index:70;opacity:0;transition:opacity .3s;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>なんでも<br>コレクション</h1>
    <div class="pill"><span class="coin">●</span><span id="coinDisp">0</span></div>
  </header>
  <div class="userbar">
    <span>👤</span><input id="unameInput" placeholder="ユーザー名" maxlength="12">
    <button class="btn secondary" style="width:auto;padding:6px 10px;font-size:12px;" id="saveNameBtn">決定</button>
    <span class="muted" id="nameStatus"></span>
  </div>

  <nav>
    <button class="tab active" data-tab="gacha">ガチャ</button>
    <button class="tab" data-tab="ufo">UFO</button>
    <button class="tab" data-tab="dex">図鑑</button>
    <button class="tab" data-tab="trade">トレード</button>
  </nav>

  <section id="tab-gacha" class="card machine">
    <div class="capsule"></div>
    <h2 style="margin:4px 0;">ガチャガチャ</h2>
    <p class="muted">通常(多)・色付き(レア)・レインボー(激レア)</p>
    <div class="gachaRow">
      <button class="btn" id="pull1">1回 (50●)</button>
      <button class="btn secondary" id="pull10">10回 (450●)</button>
    </div>
  </section>

  <section id="tab-ufo" class="card" style="display:none;">
    <h2 style="margin:0 0 8px;">UFOキャッチャー</h2>
    <p class="muted">左右に動くアームを止めてコインをゲット！何回でも挑戦OK</p>
    <div class="ufoArea" id="ufoArea">
      <div class="rail"></div>
      <div class="claw" id="claw"><div class="arm" id="armLine"></div><div class="hand"></div></div>
      <div class="prizeRow" id="prizeRow"></div>
    </div>
    <button class="btn" id="grabBtn" style="margin-top:10px;">つかむ！</button>
  </section>

  <section id="tab-dex" class="card" style="display:none;">
    <h2 style="margin:0 0 8px;">図鑑</h2>
    <p class="muted" id="dexSummary">所持中...</p>
    <div class="dexGrid" id="dexGrid"></div>
  </section>

  <section id="tab-trade" class="card" style="display:none;">
    <h2 style="margin:0 0 8px;">トレード</h2>
    <div id="tradeForm">
      <p class="muted">出品するキャラ</p>
      <select id="offerSelect"></select>
      <p class="muted" style="margin-top:8px;">欲しいキャラ</p>
      <select id="wantSelect"></select>
      <button class="btn" id="postTradeBtn" style="margin-top:10px;">出品する</button>
    </div>
    <hr style="border-color:var(--line);margin:14px 0;">
    <div id="tradeList"></div>
  </section>
</div>

<div id="overlay">
  <div class="revealCard" id="revealCard">
    <img id="revealImg" src="">
    <div class="hand" id="revealName" style="font-size:20px;"></div>
    <div class="rarityTag" id="revealTag"></div>
  </div>
  <button class="btn" id="closeReveal" style="width:160px;margin-top:20px;">とじる</button>
</div>
<div class="toast" id="toast"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBAjqK2MDDptqzhH_-J4TmPF8beXFgQJ9M",
  authDomain: "hiraikun2.firebaseapp.com",
  projectId: "hiraikun2",
  storageBucket: "hiraikun2.firebasestorage.app",
  messagingSenderId: "441487054471",
  appId: "1:441487054471:web:0cbab1e6723721deef0a22",
  measurementId: "G-HRLMZH4ZSP"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const CHARS = __CHAR_DATA__;
const RARITIES = [
  {key:'normal', label:'ノーマル', weight:70},
  {key:'color',  label:'色付き',   weight:25},
  {key:'rainbow',label:'レインボー',weight:5}
];
const COLOR_HUES = [0,120,200,270,320,45];

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}
function weightedPick(){
  const total = RARITIES.reduce((s,r)=>s+r.weight,0);
  let n = Math.random()*total;
  for(const r of RARITIES){ if(n<r.weight) return r; n-=r.weight; }
  return RARITIES[0];
}
function keyFor(charId,rarity){return charId+'_'+rarity;}
function charImgFiltered(char, rarityKey, hue){
  if(rarityKey==='normal') return `<img src="${char.img}">`;
  if(rarityKey==='color') return `<img src="${char.img}" style="filter:sepia(1) saturate(6) hue-rotate(${hue}deg);">`;
  return `<img src="${char.img}" style="filter:saturate(4) hue-rotate(0deg);animation:huecyc 2.5s linear infinite;">`;
}

let uid=null, username=null, coins=0, inventory={};

// tabs
document.querySelectorAll('nav .tab').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('nav .tab').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  ['gacha','ufo','dex','trade'].forEach(id=>document.getElementById('tab-'+id).style.display = (id===b.dataset.tab?'block':'none'));
  if(b.dataset.tab==='dex') renderDex();
  if(b.dataset.tab==='trade') { renderTradeSelects(); renderTrades(); }
}));

// auth & user doc
auth.signInAnonymously().catch(e=>toast('接続エラー: '+e.message));
auth.onAuthStateChanged(async user=>{
  if(!user) return;
  uid = user.uid;
  const snap = await db.collection('users').doc(uid).get();
  if(snap.exists){
    const d = snap.data();
    username = d.username||null; coins = d.coins||0; inventory = d.inventory||{};
    if(username) document.getElementById('unameInput').value = username;
  } else {
    await db.collection('users').doc(uid).set({coins:100, inventory:{}, createdAt:Date.now()});
    coins = 100;
  }
  updateCoinDisp();
  renderDex();
});

document.getElementById('saveNameBtn').addEventListener('click', async ()=>{
  const val = document.getElementById('unameInput').value.trim();
  if(!val){toast('名前を入力してね'); return;}
  const status = document.getElementById('nameStatus');
  try{
    await db.runTransaction(async tx=>{
      const nameRef = db.collection('usernames').doc(val);
      const nameSnap = await tx.get(nameRef);
      if(nameSnap.exists && nameSnap.data().uid!==uid) throw new Error('taken');
      tx.set(nameRef, {uid});
      tx.update(db.collection('users').doc(uid), {username: val});
    });
    username = val; status.textContent='✔ 保存しました';
  }catch(e){ status.textContent = e.message==='taken' ? '❌ 使用済みです' : 'エラー'; }
});

function updateCoinDisp(){ document.getElementById('coinDisp').textContent = coins; }

async function saveUser(){
  await db.collection('users').doc(uid).update({coins, inventory});
}
async function bumpGlobal(key){
  const ref = db.collection('globalStats').doc(key);
  await db.runTransaction(async tx=>{
    const s = await tx.get(ref);
    tx.set(ref, {total:(s.exists?s.data().total:0)+1});
  });
}

async function doPull(n){
  if(!uid){toast('接続中...少し待ってね'); return;}
  const cost = n===1?50:450;
  if(coins<cost){toast('コインが足りません'); return;}
  coins-=cost; updateCoinDisp();
  const results=[];
  for(let i=0;i<n;i++){
    const rarity = weightedPick();
    const char = CHARS[Math.floor(Math.random()*CHARS.length)];
    const hue = COLOR_HUES[Math.floor(Math.random()*COLOR_HUES.length)];
    const key = keyFor(char.id, rarity.key);
    inventory[key] = (inventory[key]||0)+1;
    bumpGlobal(key);
    results.push({char,rarity,hue});
  }
  await saveUser();
  showReveal(results,0);
}
function showReveal(results, i){
  const r = results[i];
  const ov = document.getElementById('overlay'); ov.classList.add('show');
  const card = document.getElementById('revealCard'); card.classList.remove('pop');
  document.getElementById('revealImg').outerHTML = charImgFiltered(r.char, r.rarity.key, r.hue).replace('<img','<img id="revealImg"');
  document.getElementById('revealName').textContent = r.char.name;
  const tag = document.getElementById('revealTag');
  tag.className = 'rarityTag r-'+r.rarity.key;
  if(r.rarity.key==='color') tag.style.setProperty('--rc', `hsl(${r.hue},70%,45%)`);
  tag.textContent = r.rarity.label;
  requestAnimationFrame(()=>requestAnimationFrame(()=>card.classList.add('pop')));
  if(r.rarity.key==='rainbow') burstConfetti();
  document.getElementById('closeReveal').onclick = ()=>{
    ov.classList.remove('show');
    if(i+1<results.length) setTimeout(()=>showReveal(results,i+1),150);
  };
}
function burstConfetti(){
  for(let i=0;i<40;i++){
    const c=document.createElement('div'); c.className='confetti';
    c.style.left=Math.random()*100+'vw';
    c.style.background=`hsl(${Math.random()*360},80%,60%)`;
    c.style.animation=`fall ${1+Math.random()*1.2}s linear forwards`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),2500);
  }
}
const styleFall=document.createElement('style');
styleFall.textContent='@keyframes fall{to{transform:translateY(110vh) rotate(400deg);opacity:.2;}}';
document.head.appendChild(styleFall);

document.getElementById('pull1').addEventListener('click',()=>doPull(1));
document.getElementById('pull10').addEventListener('click',()=>doPull(10));

// dex
function renderDex(){
  const grid = document.getElementById('dexGrid'); grid.innerHTML='';
  let owned=0, totalSlots=CHARS.length*RARITIES.length;
  CHARS.forEach(char=>{
    RARITIES.forEach(r=>{
      const key = keyFor(char.id,r.key);
      const count = inventory[key]||0;
      if(count>0) owned++;
      const cell = document.createElement('div');
      cell.className = 'dexCell'+(count>0?'':' locked');
      cell.innerHTML = charImgFiltered(char,r.key,120) + `<div>${char.name}</div><div class="muted">${r.label}</div><div class="cnt">×${count}</div>`;
      grid.appendChild(cell);
    });
  });
  document.getElementById('dexSummary').textContent = `所持: ${owned} / ${totalSlots} 種類`;
}

// ufo catcher
const prizes = ['🪙','💎','🪙','⭐','🪙'];
let clawPos = 10, clawDir = 1, clawTimer=null, grabbing=false;
function initUfo(){
  const area = document.getElementById('ufoArea');
  const row = document.getElementById('prizeRow'); row.innerHTML='';
  const w = area.clientWidth||300;
  prizes.forEach((p,i)=>{
    const d=document.createElement('div'); d.className='prize'; d.textContent=p; d.dataset.idx=i;
    row.appendChild(d);
  });
  clawTimer = setInterval(()=>{
    if(grabbing) return;
    clawPos += clawDir*2.2;
    if(clawPos>90||clawPos<10) clawDir*=-1;
    document.getElementById('claw').style.left = clawPos+'%';
  },20);
}
document.getElementById('grabBtn').addEventListener('click', async ()=>{
  if(grabbing || !uid) return;
  grabbing = true;
  const claw = document.getElementById('claw');
  const arm = document.getElementById('armLine');
  const area = document.getElementById('ufoArea');
  const prizesEls = [...document.querySelectorAll('.prize')];
  let hit=null, best=999;
  prizesEls.forEach(el=>{
    const r = el.getBoundingClientRect(), a = area.getBoundingClientRect();
    const pct = ((r.left+r.width/2)-a.left)/a.width*100;
    const dist = Math.abs(pct-clawPos);
    if(dist<best){best=dist; hit=el;}
  });
  const maxH = area.clientHeight-50;
  let h=0;
  const down = setInterval(()=>{
    h+=10; arm.style.height=h+'px';
    if(h>=maxH){
      clearInterval(down);
      const success = best<7;
      if(success && hit){ hit.classList.add('target'); }
      setTimeout(()=>{
        const up = setInterval(async ()=>{
          h-=10; arm.style.height=Math.max(0,h)+'px';
          if(h<=0){
            clearInterval(up);
            grabbing=false;
            if(success){
              const gain = 5+Math.floor(Math.random()*16);
              coins+=gain; updateCoinDisp(); await saveUser();
              toast(`ゲット！ +${gain}コイン`);
            } else {
              toast('あーん、失敗！もう一回！');
            }
            if(hit) hit.classList.remove('target');
          }
        },12);
      },300);
    }
  },12);
});
initUfo();

// trade
function renderTradeSelects(){
  const offer = document.getElementById('offerSelect'); const want = document.getElementById('wantSelect');
  offer.innerHTML=''; want.innerHTML='';
  const owned = Object.keys(inventory).filter(k=>inventory[k]>0);
  if(owned.length===0){ offer.innerHTML='<option>所持キャラなし</option>'; }
  owned.forEach(k=>{
    const [cid,rk] = k.split('_'); const c = CHARS.find(x=>x.id===cid); const r = RARITIES.find(x=>x.key===rk);
    const opt = document.createElement('option'); opt.value=k; opt.textContent=`${c.name} (${r.label}) ×${inventory[k]}`;
    offer.appendChild(opt);
  });
  CHARS.forEach(c=>RARITIES.forEach(r=>{
    const opt=document.createElement('option'); opt.value=keyFor(c.id,r.key); opt.textContent=`${c.name} (${r.label})`;
    want.appendChild(opt);
  }));
}
document.getElementById('postTradeBtn').addEventListener('click', async ()=>{
  if(!username){toast('先にユーザー名を決めてね'); return;}
  const offerKey = document.getElementById('offerSelect').value;
  const wantKey = document.getElementById('wantSelect').value;
  if(!offerKey || !(inventory[offerKey]>0)){toast('出品できるキャラがありません'); return;}
  await db.collection('trades').add({
    fromUid:uid, fromName:username, offerKey, wantKey, status:'open', createdAt:Date.now()
  });
  toast('出品しました！');
  renderTrades();
});
async function renderTrades(){
  const list = document.getElementById('tradeList'); list.innerHTML='読み込み中...';
  const snap = await db.collection('trades').where('status','==','open').orderBy('createdAt','desc').limit(30).get();
  list.innerHTML='';
  snap.forEach(doc=>{
    const t = doc.data();
    const [ocid,ork] = t.offerKey.split('_'); const oc = CHARS.find(x=>x.id===ocid); const orr = RARITIES.find(x=>x.key===ork);
    const [wcid,wrk] = t.wantKey.split('_'); const wc = CHARS.find(x=>x.id===wcid); const wrr = RARITIES.find(x=>x.key===wrk);
    const row = document.createElement('div'); row.className='tradeItem';
    row.innerHTML = `${charImgFiltered(oc,ork==='color'?'color':ork,60)}
      <div style="flex:1;font-size:13px;">
        <b>${t.fromName}</b> さんの出品<br>${oc.name}(${orr.label}) → ${wc.name}(${wrr.label})希望
      </div>`;
    if(t.fromUid!==uid){
      const btn=document.createElement('button'); btn.className='btn'; btn.style.width='auto'; btn.textContent='交換';
      btn.onclick = ()=>acceptTrade(doc.id,t);
      row.appendChild(btn);
    }
    list.appendChild(row);
  });
  if(snap.empty) list.innerHTML='<p class="muted">現在出品はありません</p>';
}
async function acceptTrade(id,t){
  if(!(inventory[t.wantKey]>0)){toast('交換用のキャラを持っていません'); return;}
  try{
    await db.runTransaction(async tx=>{
      const tRef = db.collection('trades').doc(id);
      const tSnap = await tx.get(tRef);
      if(!tSnap.exists || tSnap.data().status!=='open') throw new Error('すでに成立済みです');
      tx.update(tRef, {status:'completed', toUid:uid});
    });
    inventory[t.wantKey]--; inventory[t.offerKey]=(inventory[t.offerKey]||0)+1;
    await saveUser();
    toast('トレード成立！');
    renderTrades(); renderDex();
  }catch(e){ toast(e.message); }
}
</script>
</body>
</html>
